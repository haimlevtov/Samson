name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Phase 0 acceptance criterion: this job passes with no secrets configured.
  # WHY: no `env:` block and no `secrets` reference anywhere below. If a future
  #      change needs a secret here, something has grown a hidden dependency on
  #      the network — fix that rather than adding the secret.
  verify:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Enforces the metrics-engine coverage thresholds in vitest.config.ts.
      # WHY this is not the verification gate: coverage records which lines ran,
      # never whether anything was checked — docs/PLAN.md, "The merge gate".
      - run: npm run test:coverage

      # The golden set, offline. No key, no database, no spend.
      #
      # The first run proves the six planner rules are jointly satisfiable on
      # all thirty seeded histories: if they were not, some user could never be
      # given a plan at all and no prompt work would fix it.
      #
      # The second feeds the loop a block that breaks every rule and asserts it
      # is rejected — and rejected by arithmetic, before the critic is ever
      # consulted. Without it the harness only ever sees compliant plans and
      # never exercises the half of the loop that matters.
      #
      # AI-NOTE: neither run measures a model. Do not cite them as evidence of
      #          planner quality — that needs eval:planner --live and a key.
      - run: npm run eval:planner
      - run: npm run eval:planner -- --naive

  # RLS and migration tests need a real Postgres, so they run apart from the
  # secret-free job above rather than weakening it.
  db:
    name: migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # PINNED, not `latest` — this job regenerates src/db/types.ts and fails on
      # any diff, so the generator's exact output is part of the contract and an
      # upstream release is a breaking change to it.
      #
      # MEASURED, 2026-09-07: CLI v2.117.0 published at 16:47:15Z and `main`'s
      # run failed at 16:47:14Z, on nothing but formatting — the new generator
      # wraps conditional type parameters in parentheses. Every open PR went red
      # at once, for a reason none of them had anything to do with.
      #
      # AI-NOTE: bumping this pin means regenerating src/db/types.ts with the
      #          SAME version, from a LOCAL stack (`--local`), in the same
      #          commit. Do not regenerate from `--linked`: the hosted project
      #          emits an `__InternalSupabase.PostgrestVersion` that the local
      #          stack does not, so a file generated that way fails this step in
      #          a second, more confusing way.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Proves `npm run migrate` rebuilds the schema from zero: the stack starts
      # empty and every migration is applied in order.
      - name: Start local Supabase
        run: supabase start

      - name: Write local connection details
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> .env.local

      - name: Rebuild the schema from zero
        run: npm run migrate

      # tests/db/candidates.test.ts asserts invariant #5 against the seeded
      # archetypes — the home-gym user seeing no barbell lifts is the whole
      # point of that suite, and it needs that user to exist.
      #
      # WHY it is timed: PLAN.md phase 1 requires the seed to finish in under a
      # minute from an empty schema. Running it here means that stays true
      # rather than being something measured once by hand.
      - name: Seed synthetic users
        run: |
          start=$(date +%s)
          npm run seed
          elapsed=$(( $(date +%s) - start ))
          echo "seed took ${elapsed}s"
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::npm run seed took ${elapsed}s, over the 60s budget in PLAN.md phase 1"
            exit 1
          fi

      - run: npm run test:db

      - name: Fail if generated types are stale
        run: |
          supabase gen types typescript --local > src/db/types.ts
          git diff --exit-code src/db/types.ts

  # ---------------------------------------------------------------------------
  # The third of the three checks ADR 0023 splits the DOI criterion into.
  #
  # Its own job, deliberately, and NOT a required check. It is the only thing in
  # this workflow that reaches the public internet, and doi.org being slow is
  # not a reason to block a pull request that never touched the evidence table.
  # A gate that fails for reasons the author cannot fix is a gate that gets
  # switched off. `continue-on-error` is what makes that true, and it is the
  # whole safety mechanism — GitHub has no per-job `paths` filter, so this runs
  # on every push and simply reports rather than blocking.
  # ---------------------------------------------------------------------------
  doi:
    name: evidence DOIs resolve
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # The rows are database content, so the check needs a database. A fresh
      # local stack rather than hosted: this must test the rows in THIS commit,
      # not whatever is currently deployed.
      - name: Start local Supabase
        run: supabase start

      # `set -euo pipefail` and the guard are not decoration: `eval` of empty
      # output exits 0, so a failed `supabase status` would write blank values
      # and the real failure would surface later — inside a continue-on-error
      # job, where it is invisible. The db job fails loudly; this one would not.
      - name: Write local connection details
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          [ -n "${API_URL:-}" ] || { echo "::error::supabase status gave no API_URL"; exit 1; }
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> .env.local

      - run: npm run migrate

      # The output is the point as much as the exit code: every line carries the
      # source title next to its DOI, so the human half of the check — does this
      # paper say what the row claims — has something to read. ADR 0023.
      - run: npm run verify:doi
